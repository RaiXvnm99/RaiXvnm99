name: Generate Galaga Animation

on:
  schedule:
    # Jalan tiap hari jam 00:00 UTC (jam 07:00 WIB)
    - cron: '0 0 * * *'
  workflow_dispatch: {} # bisa di-trigger manual dari tab Actions

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Generate Galaga SVG (light & dark otomatis)
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: RaiXvnm99
          games: 'galaga'
          hide_month_labels: 'false'

      - name: Push hasil ke branch output
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
